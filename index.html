<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Submission</title>
    <style>
        .success {
            color: green;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <h1>Submit Your Request</h1>
    <form id="requestForm">
        <label for="request">Enter your request:</label>
        <input type="text" id="request" name="request" required>
        <button type="submit">Submit</button>
    </form>
    <div id="resultContainer"></div>

    <script>
        document.getElementById('requestForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const request = document.getElementById('request').value;
            const requestors = ["Kim", "Søren", "Peter", "Camilla", "Alberte", "Morten", "Adam", "Casper", "Anna", "Emilie"];
            const version = Math.floor(Date.now() / 1000);  // Current timestamp in epoch time
            const proxyUrl = 'https://corsproxy.io/?';  // CORS Proxy URL
            const targetUrl = 'https://www.djfeed.net/corbiline/requests/';  // Target URL
            const resultContainer = document.getElementById('resultContainer');

            // Clear previous results
            resultContainer.innerHTML = '';

            requestors.forEach(requestor => {
                const formData = new FormData();
                formData.append('request', request);
                formData.append('requestor', requestor);
                formData.append('version', version);

                fetch(proxyUrl + encodeURIComponent(targetUrl), {
                    method: 'POST',
                    body: formData
                }).then(response => {
                    const message = document.createElement('p');
                    if (response.ok) {
                        message.textContent = `Request "${request}" for ${requestor} submitted successfully.`;
                        message.classList.add('success');

                    message.classList.add('error');
                    resultContainer.appendChild(message);
                });
            });
        });
    </script>
</body>
</html>
