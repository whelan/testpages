<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Danselister – Get It On Liners 10 år</title>
<meta name="theme-color" content="#a30d0d">
<style>
  :root { --red:#a30d0d; --red-soft:#fbe9e7; --gold:#c9a24a; --line:#ead9b5; --bg:#fbf7f0; --card:#fff; --text:#1d1b19; --muted:#6b645c; }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background:var(--bg); color:var(--text); }
  button, input { font:inherit; }

  .top { position:sticky; top:0; z-index:5; background:var(--red); color:#fff; padding:10px 16px 0; padding-top:max(10px, env(safe-area-inset-top)); box-shadow:0 2px 10px rgba(0,0,0,.18); }
  .brand { display:flex; align-items:center; justify-content:space-between; gap:10px; max-width:820px; margin:0 auto; }
  .brand h1 { font-size:17px; margin:0; font-weight:700; letter-spacing:.2px; }
  .brand small { display:block; font-weight:400; opacity:.85; font-size:12px; }
  .iconbtn { background:rgba(255,255,255,.15); border:0; color:#fff; border-radius:999px; height:38px; min-width:38px; padding:0 12px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; font-size:14px; }
  .levels { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; max-width:820px; margin:10px auto 0; padding-bottom:10px; }
  .levels::-webkit-scrollbar { display:none; }
  .levels button { flex:0 0 auto; border:1px solid rgba(255,255,255,.5); background:transparent; color:#fff; border-radius:999px; padding:8px 14px; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .levels button[aria-pressed="true"] { background:#fff; color:var(--red); border-color:#fff; }
  .days { display:grid; grid-template-columns:repeat(3,1fr); max-width:820px; margin:0 auto; }
  .days button { background:transparent; border:0; color:#fff; opacity:.75; padding:10px 0 12px; font-size:15px; font-weight:700; cursor:pointer; border-bottom:3px solid transparent; }
  .days button[aria-pressed="true"] { opacity:1; border-bottom-color:#fff; }
  .days .cnt { font-weight:400; font-size:12px; opacity:.85; }

  .search { max-width:820px; margin:12px auto 0; padding:0 16px; }
  .search input { width:100%; border:1px solid var(--line); background:#fff; border-radius:12px; padding:11px 14px; font-size:16px; }
  main { max-width:820px; margin:0 auto; padding:12px 16px 40px; }
  .listhead { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin:6px 0 10px; flex-wrap:wrap; }
  .listhead h2 { margin:0; font-family:Georgia, serif; font-style:italic; color:var(--red); font-size:28px; line-height:1.1; }
  .listhead .lvl { font-size:12px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); }
  .actions { display:flex; gap:8px; }
  .actions a, .actions button { background:#fff; border:1px solid var(--red); color:var(--red); text-decoration:none; border-radius:10px; padding:8px 12px; font-size:14px; font-weight:600; cursor:pointer; }
  .legend { font-size:12.5px; color:var(--muted); margin:0 0 10px; }

  ol.list { list-style:none; margin:0; padding:0; }
  .row { display:flex; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
  .nr { flex:0 0 34px; height:34px; border-radius:9px; background:var(--red); color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; font-size:15px; font-variant-numeric:tabular-nums; }
  .body { flex:1; min-width:0; display:grid; gap:8px; }
  .dance b { display:block; font-size:16px; line-height:1.25; }
  .dance span { display:block; font-size:13px; color:var(--muted); line-height:1.3; margin-top:2px; }
  .dance .unk { font-style:italic; }
  .split { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .split .dance { padding-left:8px; border-left:3px solid var(--gold); }
  .tag { display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--red); margin-bottom:2px; }
  .nyd { color:var(--muted); font-style:italic; font-size:14px; }
  .couple { font-size:13px; background:var(--red-soft); border-radius:8px; padding:6px 8px; }
  .couple .tag { margin:0 6px 0 0; }
  .section { margin:18px 0 8px; font-weight:800; color:var(--red); font-size:15px; display:flex; align-items:center; gap:10px; }
  .section::after { content:""; flex:1; height:2px; background:var(--line); }
  .hit { background:#fff3b0; border-radius:3px; }
  .where { font-size:12px; font-weight:700; color:var(--red); margin-bottom:2px; }
  .empty { text-align:center; color:var(--muted); padding:30px 0; }
  footer { max-width:820px; margin:0 auto; padding:0 16px 40px; font-size:12.5px; color:var(--muted); }
  footer a { color:var(--red); }
  @media (max-width:420px) { .split { grid-template-columns:1fr; gap:6px; } .listhead h2 { font-size:24px; } }

  /* Print: compact, one list per page */
  @media print {
    @page { size:A4; margin:10mm 11mm; }
    body { background:#fff; }
    .top, .search, .actions, footer, .legend.screen { display:none !important; }
    main { max-width:none; padding:0; }
    .listhead { border-bottom:3px solid var(--red); padding-bottom:3mm; margin:0 0 3mm; }
    .listhead h2 { font-size:26pt; }
    .row { border:0; border-bottom:1px solid var(--line); border-radius:0; padding:1.2mm 0; margin:0; gap:3mm; break-inside:avoid; }
    .nr { flex-basis:8mm; height:auto; min-height:6mm; border-radius:3px; font-size:9.5pt; }
    .dance b { font-size:10.5pt; } .dance span { font-size:8pt; margin:0; }
    .couple { font-size:8.5pt; padding:.5mm 2mm; }
    .tag { font-size:6.5pt; margin:0; }
    .body { gap:1mm; } .split { gap:4mm; grid-template-columns:1fr 1fr; }
    .section { margin:2mm 0 1mm; font-size:10pt; break-after:avoid; }
    body.dense ol.list { columns:2; column-gap:7mm; }
    body.dense .split { grid-template-columns:1fr; gap:.6mm; }
    body.dense .row { padding:.7mm 0; }
    body.dense .dance b { font-size:9pt; } body.dense .dance span { font-size:7pt; }
    body.dense .nr { font-size:8pt; flex-basis:7mm; }
    body.dense .section { column-span:none; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>

const LEVELS = [...new Set(DATA.map(d => d.level))];
const DAYS = ["Fredag","Lørdag","Søndag"];
const slug = s => s.toLowerCase().replace(/æ/g,"ae").replace(/ø/g,"oe").replace(/å/g,"aa").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const count = l => l.rows.filter(r => r.a).length;
let state = { level: LEVELS[0], day: DAYS[0], q: "" };

function readHash() {
  const [l, d] = decodeURIComponent(location.hash.slice(1)).split("/");
  const lv = LEVELS.find(x => slug(x) === l), dy = DAYS.find(x => slug(x) === d);
  if (lv) state.level = lv; if (dy) state.day = dy;
}
function dance(d, hl) {
  if (!d) return "";
  const m = s => hl ? mark(s, hl) : esc(s);
  return `<b>${m(d[0])}</b>${d[1] ? `<span>${m(d[1])}</span>` : `<span class="unk">Koreograf ikke angivet</span>`}`;
}
function mark(s, q) {
  const i = s.toLowerCase().indexOf(q); if (i < 0) return esc(s);
  return esc(s.slice(0,i)) + `<mark class="hit">${esc(s.slice(i,i+q.length))}</mark>` + esc(s.slice(i+q.length));
}
function rowHTML(r, n, hl, where) {
  let body;
  if (r.b) {
    const b = r.b === "nyd" ? `<div class="dance"><span class="tag">Gulv B</span><div class="nyd">Nyd musikken</div></div>`
                            : `<div class="dance"><span class="tag">Gulv B</span>${dance(r.b, hl)}</div>`;
    body = `<div class="split"><div class="dance"><span class="tag">Gulv A</span>${dance(r.a, hl)}</div>${b}</div>`;
  } else body = `<div class="dance">${dance(r.a, hl)}</div>`;
  if (r.couple) body += `<div class="couple"><span class="tag">Pardans</span>${hl ? mark(r.couple, hl) : esc(r.couple)}</div>`;
  return `<li class="row"><div class="nr">${n}</div><div class="body">${where ? `<div class="where">${where}</div>` : ""}${body}</div></li>`;
}
function listHTML(l) {
  let n = 0, h = "";
  for (const r of l.rows) h += r.section ? `</ol><div class="section">${esc(r.section)}</div><ol class="list">` : rowHTML(r, ++n);
  return `<ol class="list">${h}</ol>`;
}
function render() {
  document.getElementById("levels").innerHTML = LEVELS.map(l =>
    `<button aria-pressed="${l === state.level && !state.q}" data-l="${esc(l)}">${esc(l)}</button>`).join("");
  document.getElementById("days").innerHTML = DAYS.map(d => {
    const l = DATA.find(x => x.level === state.level && x.day === d);
    return `<button aria-pressed="${d === state.day && !state.q}" data-d="${d}">${d} <span class="cnt">${l ? count(l) : 0}</span></button>`;
  }).join("");
  const main = document.getElementById("main");
  if (state.q) return renderSearch(main);
  const l = DATA.find(x => x.level === state.level && x.day === state.day);
  const hasB = l.rows.some(r => r.b), hasC = l.rows.some(r => r.couple);
  const file = `danselister/pdf/${slug(l.level)}-${slug(l.day)}.pdf`;
  document.body.classList.toggle("dense", count(l) > 18);
  document.title = `${l.day} · ${l.level} – Danselister`;
  main.innerHTML = `
    <div class="listhead"><div><div class="lvl">${esc(l.level)}</div><h2>${l.day}</h2></div>
      <div class="actions"><a href="${file}" download>⬇ PDF</a><button onclick="window.print()">🖨 Print</button></div></div>
    ${hasB ? `<p class="legend screen">Rækker med to danse: Gulv A og Gulv B danses samtidig.</p>` : ""}
    ${hasC ? `<p class="legend screen">Pardans danses samtidig på samme nummer.</p>` : ""}
    ${listHTML(l)}`;
}
function renderSearch(main) {
  const q = state.q.toLowerCase(); let h = "", hits = 0;
  for (const l of DATA) {
    let n = 0;
    for (const r of l.rows) {
      if (r.section) continue; n++;
      const txt = [r.a, Array.isArray(r.b) ? r.b : null].flat().filter(Boolean).concat(r.couple || []).join(" ").toLowerCase();
      if (txt.includes(q)) { hits++; h += rowHTML(r, n, q, `${esc(l.level)} · ${l.day}`); }
    }
  }
  document.title = "Søg – Danselister";
  main.innerHTML = `<div class="listhead"><div><div class="lvl">Søgning</div><h2>${hits} fund</h2></div></div>` +
    (hits ? `<ol class="list">${h}</ol>` : `<p class="empty">Ingen danse matcher “${esc(state.q)}”.</p>`);
}
function go() { state.q = ""; document.getElementById("q").value = ""; history.replaceState(null, "", `#${slug(state.level)}/${slug(state.day)}`); render(); scrollTo({top:0}); }
document.getElementById("levels").onclick = e => { const b = e.target.closest("button"); if (b) { state.level = b.dataset.l; go(); } };
document.getElementById("days").onclick = e => { const b = e.target.closest("button"); if (b) { state.day = b.dataset.d; go(); } };
document.getElementById("searchBtn").onclick = () => { const s = document.getElementById("searchBox"); s.hidden = !s.hidden; if (!s.hidden) document.getElementById("q").focus(); else { state.q = ""; render(); } };
document.getElementById("q").oninput = e => { state.q = e.target.value.trim(); render(); };
let x0 = null;
document.getElementById("main").addEventListener("touchstart", e => { x0 = [e.touches[0].clientX, e.touches[0].clientY]; }, {passive:true});
document.getElementById("main").addEventListener("touchend", e => {
  if (!x0 || state.q) return; const dx = e.changedTouches[0].clientX - x0[0], dy = e.changedTouches[0].clientY - x0[1]; x0 = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy)) { const i = DAYS.indexOf(state.day) + (dx < 0 ? 1 : -1); if (DAYS[i]) { state.day = DAYS[i]; go(); } }
});
addEventListener("hashchange", () => { readHash(); render(); });
readHash(); render();
</script>
