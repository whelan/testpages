<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danselister – Intermediate/Advanced</title>
<style>
  :root { --red:#a30d0d; --line:#d9c9a8; --bg:#fffdf8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Segoe UI", Arial, sans-serif; background:#eee; color:#1a1a1a; }
  .toolbar { text-align:center; padding:12px; }
  .toolbar button { background:var(--red); color:#fff; border:0; padding:10px 18px; border-radius:6px; font-size:16px; cursor:pointer; }
  .page { background:var(--bg); width:210mm; max-width:100%; min-height:297mm; margin:0 auto 20px; padding:12mm 12mm;
          box-shadow:0 2px 8px rgba(0,0,0,.2); border-top:8px solid var(--red); }
  header { display:flex; justify-content:space-between; align-items:baseline; border-bottom:3px solid var(--red); padding-bottom:4mm; margin-bottom:5mm; }
  header h1 { margin:0; font-family: Georgia, serif; font-style:italic; font-size:34pt; color:var(--red); }
  header .lvl { font-weight:700; letter-spacing:1px; font-size:11pt; }
  header .sub { font-size:10pt; color:#555; }
  ol { list-style:none; margin:0; padding:0; columns:2; column-gap:8mm; }
  li { break-inside:avoid; display:flex; gap:3mm; padding:1.6mm 0; border-bottom:1px solid var(--line); }
  .nr { flex:0 0 9mm; background:var(--red); color:#fff; font-weight:700; text-align:center; border-radius:3px; align-self:center; padding:1mm 0; font-size:10pt; }
  .d b { display:block; font-size:11.5pt; }
  .d span { font-size:8.5pt; color:#555; }
  .page.long li { padding:.5mm 0; }
  .page.long .nr { font-size:8.5pt; padding:.5mm 0; }
  .page.long .d b { font-size:9.5pt; }
  .page.long .d span { font-size:7pt; line-height:1.15; display:block; }
  @media (max-width:600px){ ol{columns:1;} .page{padding:16px;min-height:0;} header h1{font-size:26pt;} }
  @media print {
    @page { size:A4; margin:10mm; }
    body { background:#fff; }
    .toolbar { display:none; }
    .page { box-shadow:none; margin:0; width:auto; min-height:0; height:auto; padding:0; border-top:6px solid var(--red); page-break-after:always; break-after:page; }
    .page:last-child { page-break-after:auto; break-after:auto; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>
